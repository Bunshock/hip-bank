services:
  accounts-service:
    image: "bunshock/accounts:v1"
    container_name: "hipbank-accounts_ms"
    ports:
      - "8080:8080"
    depends_on:
      configserver:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: "700m"
    networks:
      - hipbank-network
    environment:
      SPRING_APPLICATION_NAME: "accounts"
      SPRING_CONFIG_IMPORT: "configserver:http://configserver:8071"
      SPRING_PROFILES_ACTIVE: "prod"
  loans-service:
    image: "bunshock/loans:v1"
    container_name: "hipbank-loans_ms"
    ports:
      - "8090:8090"
    depends_on:
      configserver:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: "700m"
    networks:
      - hipbank-network
    environment:
      SPRING_APPLICATION_NAME: "loans"
      SPRING_CONFIG_IMPORT: "configserver:http://configserver:8071"
      SPRING_PROFILES_ACTIVE: "prod"
  cards-service:
    image: "bunshock/cards:v1"
    container_name: "hipbank-cards_ms"
    ports:
      - "8100:8100"
    depends_on:
      configserver:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: "700m"
    networks:
      - hipbank-network
    environment:
      SPRING_APPLICATION_NAME: "cards"
      SPRING_CONFIG_IMPORT: "configserver:http://configserver:8071"
      SPRING_PROFILES_ACTIVE: "prod"
  configserver:
    image: "bunshock/configserver:v1"
    container_name: "hipbank-configserver_ms"
    ports:
      - "8071:8071"
    healthcheck:
      test: "curl --fail --silent http://localhost:8071/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: "700m"
    networks:
      - hipbank-network
networks:
  hipbank-network:
    driver: "bridge"